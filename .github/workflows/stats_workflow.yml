name: Collecte stats carburants

on:
  schedule:
    - cron: "0 5 * * *" # tous les jours à 5h UTC (7h Albi l'été)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collecter prix + Brent
        run: node fetch_stats.js

      - name: Commit historique + data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json docs/data_stats.json
          git diff --cached --quiet || git commit -m "stats: collecte $(date -u +%F)"
          git push
